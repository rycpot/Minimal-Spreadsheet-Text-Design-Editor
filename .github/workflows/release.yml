# Publishes the store-ready zip as a GitHub Release, named after "version" in
# manifest.json (e.g. v1.0.1). It runs:
#   - Automatically when manifest.json changes on main: releases the version
#     if it has no release yet, otherwise does nothing. So bumping the version
#     and merging is the whole release process.
#   - Actions tab -> Release -> Run workflow (on main): creates the tag too.
#   - Push a tag like v1.0.1 that matches manifest.json.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['manifest.json']   # applies to main only; tag pushes always run

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Run this workflow on main (it was started on ${GITHUB_REF_NAME})"
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              echo "Release ${tag} already exists; nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release ${tag} already exists. Bump \"version\" in manifest.json first."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build zip
        if: steps.tag.outputs.skip != 'true'
        id: build
        run: echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      # Unless a tag push started this run, gh creates the tag at this commit.
      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" "${{ steps.build.outputs.zip }}" \
            --target "${GITHUB_SHA}" --title "${{ steps.tag.outputs.tag }}" --generate-notes
